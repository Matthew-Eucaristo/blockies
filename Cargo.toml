[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Matthew-Eucaristo/blockies"

[workspace.dependencies]
blockies-anim = { path = "crates/blockies-anim" }
blockies-dsl = { path = "crates/blockies-dsl" }
blockies-model = { path = "crates/blockies-model" }
blockies-ops = { path = "crates/blockies-ops" }
blockies-protocol = { path = "crates/blockies-protocol" }
blockies-server = { path = "crates/blockies-server" }
blockies-sim = { path = "crates/blockies-sim", default-features = false }
blockies-store = { path = "crates/blockies-store" }
blockies-tui = { path = "crates/blockies-tui" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
lz4_flex = "0.14.0"
rayon = "1.12.0"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
wasm-bindgen = "0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"

# Fast local loop: small debug info, optimised dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
