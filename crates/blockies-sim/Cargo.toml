[package]
name = "blockies-sim"
description = "The [c] block field: deterministic, integer-only falling sand with chunk sleeping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Tile rows on rayon threads. Off for wasm32 (single thread); results are identical either way.
parallel = ["dep:rayon"]

[dependencies]
blockies-model.workspace = true
rayon = { workspace = true, optional = true }

[lints]
workspace = true
