[package]
name = "blockies-wasm"
description = "WebAssembly facade: the same sim and DSL for the browser and Node (JS SDK base)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blockies-dsl.workspace = true
blockies-model.workspace = true
blockies-protocol.workspace = true
blockies-sim.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# Not the workspace lint set: wasm-bindgen's generated glue needs `unsafe` at the FFI edge,
# so `forbid(unsafe_code)` cannot apply here. This crate itself writes no unsafe code.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
