version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003"]
    errcheck:
      exclude-functions:
        - (io.Writer).Write
        - (net/http.ResponseWriter).Write
        - io.WriteString
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
